name: Release CUDA 12.9 wheels

on:
  workflow_dispatch:
  push:
    branches: [v0.5.23_sm89]
    paths:
      - .github/workflows/release-cu129.yml
      - scripts/build_cu129.py
      - scripts/cu129.Dockerfile
      - python/pyproject.toml
      - python/sglang/kernels/aot/**
      - python/sglang/srt/model_executor/runner/decode_cuda_graph_runner.py

permissions:
  contents: read

concurrency:
  group: cu129-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        python: ["311", "312"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make room for CUDA build image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build toolchain image
        run: docker build -f scripts/cu129.Dockerfile --build-arg PYTHON_TAG=cp${{ matrix.python }}-cp${{ matrix.python }} -t sglang-cu129-builder .
      - name: Add swap for CUDA compiler peaks
        run: |
          sudo fallocate -l 12G /mnt/cu129.swap
          sudo chmod 600 /mnt/cu129.swap
          sudo mkswap /mnt/cu129.swap
          sudo swapon /mnt/cu129.swap
          free -h
      - name: Compile kernel object shard
        run: |
          mkdir -p build/cu129
          docker run --rm -v "$PWD:/src" sglang-cu129-builder \
            --kernel-shard ${{ matrix.shard }} --kernel-shards 8
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cu129-cp${{ matrix.python }}-shard-${{ matrix.shard }}-logs
          path: build/cu129/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: cu129-cp${{ matrix.python }}-objects-${{ matrix.shard }}
          path: build/cu129/kernel-objects-*.tar.gz
          compression-level: 0
          if-no-files-found: error

  build:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        python: ["311", "312"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make room for CUDA build image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build toolchain image
        run: docker build -f scripts/cu129.Dockerfile --build-arg PYTHON_TAG=cp${{ matrix.python }}-cp${{ matrix.python }} -t sglang-cu129-builder .
      - uses: actions/download-artifact@v4
        with:
          pattern: cu129-cp${{ matrix.python }}-objects-*
          path: parts
          merge-multiple: true
      - name: Verify objects, link kernel and build wheels
        run: |
          mkdir -p build/cu129
          docker run --rm -v "$PWD:/src" sglang-cu129-builder \
            --assemble-kernel /src/parts --kernel-shards 8
      - name: Verify checksums and wheel metadata
        run: |
          cd build/cu129/dist
          sha256sum -c SHA256SUMS
          /usr/bin/python3 - <<'PY'
          import glob, zipfile
          from email.parser import BytesParser
          for wheel in glob.glob('*.whl'):
              with zipfile.ZipFile(wheel) as archive:
                  metadata = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
                  parsed = BytesParser().parsebytes(archive.read(metadata))
                  assert parsed['Version'].endswith('+cu129'), parsed['Version']
                  assert 'torch==2.13.0+cu129' in parsed.get_all('Requires-Dist')
                  print(wheel, parsed['Version'])
          PY
          sudo mv SHA256SUMS SHA256SUMS-cp${{ matrix.python }}.txt
          sudo mv build-manifest.json build-manifest-cp${{ matrix.python }}.json
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cu129-cp${{ matrix.python }}-build-logs
          path: build/cu129/*.log
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cu129-cp${{ matrix.python }}-wheels
          path: build/cu129/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cu129-cp*-wheels
          path: dist
      - name: Require L20 inference validation of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          state=$(gh api "repos/$GH_REPO/commits/$SOURCE_SHA/status" \
            --jq '[.statuses[] | select(.context == "L20 inference / cu129")][0].state')
          if [ "$state" != success ]; then
            echo "L20 inference / cu129 must pass for $SOURCE_SHA before publication (state: $state)."
            exit 1
          fi
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: v0.5.23-cu129-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > release-notes.txt <<'EOF'
          SGLang v0.5.23 adapted for Torch 2.13.0+cu129, CPython 3.11 and 3.12, preserving the upstream CUDA 12.9 architecture defaults.

          Built from the linked commit on a glibc 2.28 baseline. Includes the main package and AOT kernel wheels, build metadata and SHA256 checksums. Install Torch from https://download.pytorch.org/whl/cu129 before installing both wheels together.

          DeepGEMM and newer-GPU-only backends are outside the supported L20 inference path. Older drivers require a separately configured NVIDIA forward-compatibility package; the wheels do not install a driver.

          GitHub-hosted build jobs have no GPU. Publication additionally requires a passing L20 inference commit status. See scripts/CU129.md for the locally verified setup and inference command.
          EOF
          gh release create "$RELEASE_TAG" dist/*/* --target "$SOURCE_SHA" \
            --title "SGLang 0.5.23 / CUDA 12.9 (build $GITHUB_RUN_NUMBER)" \
            --notes-file release-notes.txt --prerelease
